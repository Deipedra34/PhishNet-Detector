name: Docker Publish

# Build the Docker image and push it to Docker Hub whenever a semver tag
# (e.g. v2.1.0) is pushed - same trigger as the Release workflow.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # QEMU lets the runner build the linux/arm64 runtime stage on an amd64 host.
      # (The Maven build stage itself runs natively - see --platform in the Dockerfile.)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Requires the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets
      # (Settings > Secrets and variables > Actions). Use a Docker Hub access
      # token, not the account password.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags the image with the pushed git tag (e.g. :v2.1.0) and :latest.
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/phishnet-detector:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/phishnet-detector:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
