name: Release

# Build and publish a GitHub Release whenever a semver tag (e.g. v1.9.0) is pushed.
on:
  push:
    tags:
      - 'v*.*.*'

# The built-in GITHUB_TOKEN needs write access to create the release and upload assets.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      # package runs the test suite too, so a broken build never gets released.
      # Produces the runnable fat jar at target/phishnet.jar (finalName in pom.xml).
      - name: Build runnable jar
        run: mvn -B clean package

      # Create the release for the pushed tag, auto-generate notes from commits/PRs,
      # and attach the jar. Authenticates with the built-in GITHUB_TOKEN.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: target/phishnet.jar
