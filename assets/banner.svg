<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 640" width="2000" height="640">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#232a3d"/>
    </pattern>
  </defs>

  <rect width="2000" height="640" fill="#0b0e17"/>
  <rect width="2000" height="640" fill="url(#dots)"/>

  <!-- decorative constellation, top right -->
  <g stroke="#ff6b81" stroke-width="2.5" fill="#ff6b81" opacity="0.9">
    <line x1="1460" y1="260" x2="1585" y2="185"/>
    <line x1="1585" y1="185" x2="1710" y2="220"/>
    <line x1="1710" y1="220" x2="1835" y2="140"/>
    <line x1="1460" y1="260" x2="1495" y2="370"/>
    <line x1="1710" y1="220" x2="1735" y2="350"/>
    <circle cx="1460" cy="260" r="8"/>
    <circle cx="1585" cy="185" r="8"/>
    <circle cx="1710" cy="220" r="8"/>
    <circle cx="1835" cy="140" r="8"/>
    <circle cx="1495" cy="370" r="8"/>
    <circle cx="1735" cy="350" r="8"/>
  </g>

  <!-- envelope + hook icon -->
  <g transform="translate(150,240)" fill="none" stroke="#ff6b81" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="140" height="96" rx="10"/>
    <path d="M0,10 L70,66 L140,10"/>
    <circle cx="70" cy="120" r="7" fill="#ff6b81" stroke="none"/>
    <path d="M70,127 L70,165"/>
    <path d="M70,165 C70,205 130,205 130,165 C130,135 90,135 90,160 C90,180 115,182 120,168"/>
  </g>

  <!-- wordmark -->
  <text x="345" y="330" font-family="'Segoe UI', Arial, sans-serif" font-size="118" font-weight="800" fill="#f2f4f8">Phish<tspan fill="#ff5470">Net</tspan></text>

  <!-- subtitle -->
  <text x="350" y="410" font-family="'Segoe UI', Arial, sans-serif" font-size="34" fill="#8b93a7">Phishing link &amp; email detection, built with Java</text>

  <!-- badges -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="30" fill="#e7e9ee">
    <rect x="350" y="470" width="245" height="80" rx="14" fill="none" stroke="#7a2e3a" stroke-width="2"/>
    <text x="472" y="520" text-anchor="middle">URL Analysis</text>

    <rect x="620" y="470" width="270" height="80" rx="14" fill="none" stroke="#7a2e3a" stroke-width="2"/>
    <text x="755" y="520" text-anchor="middle">Email Scanning</text>

    <rect x="915" y="470" width="230" height="80" rx="14" fill="none" stroke="#7a2e3a" stroke-width="2"/>
    <text x="1030" y="520" text-anchor="middle">Risk Scoring</text>

    <rect x="1170" y="470" width="200" height="80" rx="14" fill="none" stroke="#7a2e3a" stroke-width="2"/>
    <text x="1270" y="520" text-anchor="middle">SSL Check</text>
  </g>

  <!-- byline -->
  <text x="350" y="600" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-style="italic" fill="#5b6376">by Deipedra</text>
</svg>
