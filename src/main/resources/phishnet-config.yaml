# TLDs with historically high spam/phishing abuse rates, per public reporting
# such as Spamhaus's TLD abuse statistics (many are free or very cheap to
# register, which draws high-volume throwaway phishing use). This is a
# heuristic signal only, not a hard rule - plenty of legitimate sites use
# these TLDs too, so a suspiciousTld match should only ever contribute
# partial weight to the total score (see scoring.weights.suspiciousTld
# below), never an automatic HIGH verdict on its own.
suspiciousTlds:
  - accountant
  - bid
  - cf
  - click
  - club
  - country
  - download
  - ga
  - gdn
  - gq
  - kim
  - link
  - loan
  - men
  - ml
  - party
  - rest
  - review
  - science
  - stream
  - support
  - tk
  - top
  - win
  - work
  - xyz
  - zip

