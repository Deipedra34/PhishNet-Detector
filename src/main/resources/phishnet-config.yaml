# PhishNet Detector - default configuration.
#
# Everything here is tunable without recompiling: pass a modified copy of
# this file via `--config <path>` on the CLI. Weights are arbitrary points
# added to a signal's total contribution to the 0-100 risk score; thresholds
# define where the Low/Medium/High bands start.

# Brands checked for typosquatting/combosquatting/homograph impersonation
# (edit-distance and substring matching against the domain - see
# UrlAnalyzer#detectTyposquatting / #detectHomograph). Grouped by category
# and alphabetized within each group purely for readability; order has no
# effect on matching. Add more here any time - no code changes needed.
brands:
  # Banking / finance
  - americanexpress
  - bankofamerica
  - barclays
  - capitalone
  - chase
  - citibank
  - hsbc
  - revolut
  - santander
