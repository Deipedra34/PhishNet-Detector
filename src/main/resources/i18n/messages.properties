phishnet\ history.search.no-color = Disable ANSI colors even if the terminal supports them
phishnet\ history.search.verbose = Also show each scan's domain, domain age, email subject, and signals
phishnet\ history.search.quiet = Print one machine-parsable line per scan (LEVEL SCORE TARGET)
phishnet\ history.search.target = Case-insensitive substring of the URL, domain, email file name, or email subject
phishnet\ history.search.risk = Only scans with this risk level: ${COMPLETION-CANDIDATES}
phishnet\ history.search.type = Only scans of this type: ${COMPLETION-CANDIDATES}
