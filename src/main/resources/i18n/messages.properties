# PhishNet Detector - user-facing text, English (the default language).
#
# messages_tr.properties holds the Turkish translation; any key missing there
# falls back to this file. Placeholders are {0}, {1}, ... (replaced as plain text,
# so apostrophes need no escaping). This file is read as UTF-8.
#
# Help text keys follow picocli's resource bundle conventions: <command>.<option>
# for an option's description (e.g. "phishnet.url" for --url of the scan command,
# "phishnet\ history.list.limit" for --limit of "phishnet history list"),
# <command>.usage.* for the description, headings, and examples, and
# <command>.group.* for option group headings. Help text is formatted by picocli:
# %n is a line break, %% a percent sign, and ${DEFAULT-VALUE} the option's default.

# ======================================================================
# Command-line help (picocli)
# ======================================================================

# --help and --version, on every command
mixinStandardHelpOptions.help = Show this help message and exit.
mixinStandardHelpOptions.version = Print version information and exit.

# --- phishnet ---
phishnet.usage.description = Analyzes URLs, TLS certificates, and .eml email files for phishing indicators, and combines whatever it finds into a single 0-100 risk score with a Low/Medium/High label and a plain-language recommendation.
phishnet.usage.synopsisHeading = %nUsage:%n
phishnet.usage.optionListHeading = %nOptions:%n
phishnet.usage.footerHeading = %nExamples:%n
phishnet.usage.footer.0 = \  phishnet --url https://example.com
phishnet.usage.footer.1 = \  phishnet --email suspicious.eml --verbose
phishnet.usage.footer.2 = \  phishnet --batch urls.txt --json
phishnet.usage.footer.3 = \  phishnet serve --port 8080   (REST API mode; see: phishnet serve --help)
phishnet.usage.footer.4 = \  phishnet history list        (past scans; see: phishnet history --help)
phishnet.usage.footer.5 = \  phishnet model info          (ML model details; see: phishnet model --help)
phishnet.usage.footer.6 = \  phishnet monitor --help      (watch a mailbox for phishing as mail arrives)
phishnet.usage.footer.7 = \  phishnet queue --help        (distributed scanning with Redis workers)
phishnet.usage.footer.8 = \  phishnet feeds status        (threat intelligence feeds; see: phishnet feeds --help)
phishnet.usage.footer.9 = 
phishnet.usage.footer.10 = See the project README for the full option reference and sample output.
phishnet.url = Analyze a single URL
phishnet.email = Analyze a single .eml email file
phishnet.batch = Analyze a newline-separated file of URLs ('#' comments allowed)
phishnet.config = Use a custom YAML config instead of the bundled default
phishnet.json = Output machine-readable JSON instead of a human-readable report
phishnet.no-color = Disable ANSI colors even if the terminal supports them
phishnet.verbose = Show each analyzer's internal reasoning, not just the summary
phishnet.quiet = Print one machine-parsable line only (LEVEL SCORE TARGET); exit code reflects risk
phishnet.history-file = Append scan results to this CSV file (default: ./phishnet-history.csv)
phishnet.no-history = Do not append this run's results to the scan history CSV
phishnet.history-db = Record scan results in this SQLite database (default: ~/.phishnet/phishnet-history.db; query it with: phishnet history)
phishnet.no-history-db = Do not record this run's results in the scan history database
phishnet.html-report = Write a self-contained, styled HTML report of this run's results to <path> (for --batch, written once at the end covering the whole run)
phishnet.no-whois = Skip the live WHOIS domain-age lookup (for offline/fast scans or CI); domain age is then left out of the score entirely
phishnet.no-threat-feeds = Don't check the OpenPhish/PhishTank threat intelligence feeds (no feed downloads, cached feeds unused); feed matches are then left out of the score
phishnet.threads = Scan --batch URLs on this many threads in parallel (default: one per CPU core; 1 scans them one at a time). Output order is the same either way.
phishnet.no-ml = Skip the experimental ML phishing-probability signal entirely; the rule-based risk score is unaffected
phishnet.model = ML model file, trained from the bundled dataset on first use if missing (default: ~/.phishnet/phishnet-model.json; see: phishnet model --help)
phishnet.group.url = %nInput options:%n
phishnet.group.json = %nOutput options:%n
phishnet.group.history-file = %nHistory options:%n
phishnet.group.html-report = %nReport options:%n
phishnet.group.no-whois = %nNetwork options:%n
phishnet.group.threads = %nBatch options:%n
phishnet.group.no-ml = %nMachine learning options (experimental):%n

# --- phishnet serve ---
phishnet\ serve.usage.description = Start an HTTP server exposing the scanner as a JSON REST API (POST /api/scan/url, POST /api/scan/email, GET /api/health), plus read-only history and feed status endpoints and, when it has been built, the web dashboard on the same port.
phishnet\ serve.usage.synopsisHeading = %nUsage:%n
phishnet\ serve.usage.optionListHeading = %nOptions:%n
phishnet\ serve.usage.footerHeading = %nExamples:%n
phishnet\ serve.usage.footer.0 = \  phishnet serve
phishnet\ serve.usage.footer.1 = \  phishnet serve --port 9090 --no-whois
phishnet\ serve.usage.footer.2 = \  phishnet serve --dashboard dashboard/dist
phishnet\ serve.usage.footer.3 = \  phishnet serve --regenerate-key      (replace the API key)
phishnet\ serve.usage.footer.4 = \  phishnet serve --no-auth             (local development only: no API key)
phishnet\ serve.port = TCP port to listen on (default: ${DEFAULT-VALUE}; 0 picks a free port)
phishnet\ serve.config = Use a custom YAML config instead of the bundled default
phishnet\ serve.no-whois = Skip the live WHOIS domain-age lookup for URL scans
phishnet\ serve.history-db = Record API scans in this SQLite database (default: ~/.phishnet/phishnet-history.db; query it with: phishnet history)
phishnet\ serve.no-history-db = Do not record API scans in the scan history database
phishnet\ serve.dashboard = Serve the built web dashboard from this directory (default: $PHISHNET_DASHBOARD_DIR, else ./dashboard/dist, else a dashboard/ folder next to the jar - the first that contains an index.html)
phishnet\ serve.no-dashboard = Serve the REST API only, without the web dashboard
phishnet\ serve.api-key-file = Where the API key is kept (default: ~/.phishnet/api-key; created with a new random key on first run). $PHISHNET_API_KEY, when set, is used instead.
phishnet\ serve.regenerate-key = Replace the API key with a new random one before starting (printed once). The old key stops working; give the new one to every client.
phishnet\ serve.rate-limit = Scan requests each client IP may make per minute before getting 429 Too Many Requests (default: api.rateLimitPerMinute from the config, 60; 0 turns it off)
phishnet\ serve.no-auth = Don't require an API key: anyone who can reach this port can scan and read the scan history. Meant for local development only.

