# --- phishnet monitor ---
phishnet\ monitor.usage.description = Watch a mailbox over IMAP (or POP3) and scan each new email for phishing as it arrives. Read-only unless --flag-suspicious or --move-to-folder is given. Runs until Ctrl+C.
phishnet\ monitor.usage.synopsisHeading = %nUsage:%n
phishnet\ monitor.usage.optionListHeading = %nOptions:%n
phishnet\ monitor.usage.footerHeading = %nExamples:%n
phishnet\ monitor.usage.footer.0 = \  phishnet monitor --host imap.gmail.com --username you@gmail.com --ssl
phishnet\ monitor.usage.footer.1 = \  phishnet monitor --host mail.example.com --username alice --starttls \\
phishnet\ monitor.usage.footer.2 = \      --password
phishnet\ monitor.usage.footer.3 = \  PHISHNET_MAIL_PASSWORD=... phishnet monitor --host mail.example.com \\
phishnet\ monitor.usage.footer.4 = \      --username alice --ssl --flag-suspicious --move-to-folder Suspicious
phishnet\ monitor.usage.footer.5 = 
phishnet\ monitor.usage.footer.6 = Gmail, Outlook.com, iCloud and Yahoo need an app password (or --oauth2),
phishnet\ monitor.usage.footer.7 = not your regular account password. See the README's "Real-Time Email
phishnet\ monitor.usage.footer.8 = Monitoring" section for provider settings and security notes.
phishnet\ monitor.host = Mail server, e.g. imap.gmail.com
phishnet\ monitor.port = Server port (default: 993 for IMAP with --ssl, 143 without; 995/110 for POP3)
phishnet\ monitor.username = Login name, usually your email address (or set PHISHNET_MAIL_USERNAME)
phishnet\ monitor.password = Prompt for the password without echoing it. Without this option the password is read from PHISHNET_MAIL_PASSWORD, or prompted for when running in a terminal. It is never accepted as a plain command-line value.
phishnet\ monitor.protocol = ${COMPLETION-CANDIDATES} (default: ${DEFAULT-VALUE}). POP3 is polling-only and read-only.
phishnet\ monitor.ssl = Use TLS from the start (IMAPS / POP3S) - the usual choice
phishnet\ monitor.starttls = Connect in plain text, then require an upgrade with STARTTLS
phishnet\ monitor.allow-plaintext = No encryption at all: the password is sent readable. Only for a local test server.
phishnet\ monitor.folder = IMAP folder to watch (default: ${DEFAULT-VALUE})
phishnet\ monitor.oauth2 = Log in with OAuth2 (SASL XOAUTH2): the password value is an access token you obtained from your provider
phishnet\ monitor.poll-interval = How often to check for new mail when the server doesn't support IMAP IDLE, and always for POP3 (default: ${DEFAULT-VALUE}, minimum 5)
phishnet\ monitor.act-on = Lowest risk level treated as suspicious: MEDIUM or HIGH (default: ${DEFAULT-VALUE})
phishnet\ monitor.flag-suspicious = Opt in: mark suspicious messages with \\Flagged (and the $Phishing keyword where allowed). Changes the mailbox; IMAP only.
phishnet\ monitor.move-to-folder = Opt in: move suspicious messages to this folder, creating it if needed. Changes the mailbox; IMAP only.
phishnet\ monitor.record-all = Record every scanned message in the scan history, not only suspicious ones
phishnet\ monitor.history-file = Scan history CSV (default: ./phishnet-history.csv)
phishnet\ monitor.no-history = Do not append results to the scan history CSV
phishnet\ monitor.history-db = Scan history database (default: ~/.phishnet/phishnet-history.db)
phishnet\ monitor.no-history-db = Do not record results in the scan history database
phishnet\ monitor.config = Use a custom YAML config instead of the bundled default
phishnet\ monitor.verbose = Also show every message's signals and mailbox label, and connection attempts
phishnet\ monitor.quiet = Print only one line per scanned message (LEVEL SCORE LABEL)
phishnet\ monitor.no-color = Disable ANSI colors even if the terminal supports them
phishnet\ monitor.group.ssl = %nEncryption (one is required):%n

# --- phishnet queue ---
phishnet\ queue.usage.description = Distributed scanning through a shared Redis queue: 'produce' queues URLs from a file, 'worker' scans queued URLs. Run as many workers, on as many machines, as you like.
phishnet\ queue.usage.synopsisHeading = %nUsage:%n
phishnet\ queue.usage.optionListHeading = %nOptions:%n
phishnet\ queue.usage.commandListHeading = %nCommands:%n
phishnet\ queue.usage.footerHeading = %nExamples:%n
phishnet\ queue.usage.synopsisSubcommandLabel = COMMAND
phishnet\ queue.usage.footer.0 = \  docker run -d --name phishnet-redis -p 6379:6379 redis
phishnet\ queue.usage.footer.1 = \  phishnet queue produce --file urls.txt
phishnet\ queue.usage.footer.2 = \  phishnet queue worker --threads 8
phishnet\ queue.usage.footer.3 = \  phishnet queue worker --redis-host queue.internal --retry --no-whois
phishnet\ queue.usage.footer.4 = 
phishnet\ queue.usage.footer.5 = Set PHISHNET_REDIS_PASSWORD (and PHISHNET_REDIS_USERNAME) if your Redis needs a login.

# --- phishnet queue produce ---
phishnet\ queue.produce.usage.description = Queue every URL in a file (one per line, '#' comments allowed) as a scan job.
phishnet\ queue.produce.usage.synopsisHeading = %nUsage:%n
phishnet\ queue.produce.usage.optionListHeading = %nOptions:%n
phishnet\ queue.produce.redis-host = Redis host (default: ${DEFAULT-VALUE})
phishnet\ queue.produce.redis-port = Redis port (default: ${DEFAULT-VALUE})
phishnet\ queue.produce.redis-ssl = Connect to Redis over TLS
phishnet\ queue.produce.queue = Name of the Redis list used as the job queue (default: ${DEFAULT-VALUE})
phishnet\ queue.produce.file = File of URLs to queue, the same format as --batch
phishnet\ queue.produce.quiet = Print only the number of jobs queued

# --- phishnet queue worker ---
phishnet\ queue.worker.usage.description = Take URLs off the queue and scan them, recording each result in the scan history. Runs until Ctrl+C (or, with --exit-when-empty, until the queue is empty).
phishnet\ queue.worker.usage.synopsisHeading = %nUsage:%n
phishnet\ queue.worker.usage.optionListHeading = %nOptions:%n
phishnet\ queue.worker.redis-host = Redis host (default: ${DEFAULT-VALUE})
phishnet\ queue.worker.redis-port = Redis port (default: ${DEFAULT-VALUE})
phishnet\ queue.worker.redis-ssl = Connect to Redis over TLS
phishnet\ queue.worker.queue = Name of the Redis list used as the job queue (default: ${DEFAULT-VALUE})
phishnet\ queue.worker.threads = Jobs to scan in parallel, each thread with its own Redis connection (default: one per CPU core)
phishnet\ queue.worker.retry = If Redis is unreachable or the connection drops, keep retrying with backoff (2s doubling up to 1 min) instead of stopping with an error
phishnet\ queue.worker.exit-when-empty = Stop once the queue is empty instead of waiting for more jobs
phishnet\ queue.worker.no-whois = Skip the live WHOIS domain-age lookup
phishnet\ queue.worker.config = Use a custom YAML config instead of the bundled default
phishnet\ queue.worker.history-file = Scan history CSV (default: ./phishnet-history.csv)
phishnet\ queue.worker.no-history = Do not append results to the scan history CSV
phishnet\ queue.worker.history-db = Scan history database (default: ~/.phishnet/phishnet-history.db)
phishnet\ queue.worker.no-history-db = Do not record results in the scan history database
phishnet\ queue.worker.verbose = Also show every signal, the domain age, and which thread scanned each job
phishnet\ queue.worker.quiet = Print only one line per job (LEVEL SCORE TARGET)
phishnet\ queue.worker.no-color = Disable ANSI colors even if the terminal supports them

