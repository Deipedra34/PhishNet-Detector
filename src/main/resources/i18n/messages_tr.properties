# --- phishnet monitor ---
phishnet\ monitor.usage.description = Bir posta kutusunu IMAP (veya POP3) üzerinden izler ve gelen her yeni e-postayı geldiği anda oltalamaya karşı tarar. --flag-suspicious veya --move-to-folder verilmedikçe salt okunurdur. Ctrl+C'ye basılana kadar çalışır.
phishnet\ monitor.usage.synopsisHeading = %nKullanım:%n
phishnet\ monitor.usage.optionListHeading = %nSeçenekler:%n
phishnet\ monitor.usage.footerHeading = %nÖrnekler:%n
phishnet\ monitor.usage.footer.0 = \  phishnet monitor --host imap.gmail.com --username you@gmail.com --ssl
phishnet\ monitor.usage.footer.1 = \  phishnet monitor --host mail.example.com --username alice --starttls \\
phishnet\ monitor.usage.footer.2 = \      --password
phishnet\ monitor.usage.footer.3 = \  PHISHNET_MAIL_PASSWORD=... phishnet monitor --host mail.example.com \\
phishnet\ monitor.usage.footer.4 = \      --username alice --ssl --flag-suspicious --move-to-folder Suspicious
phishnet\ monitor.usage.footer.5 =
phishnet\ monitor.usage.footer.6 = Gmail, Outlook.com, iCloud ve Yahoo, normal hesap parolanızı değil bir uygulama
phishnet\ monitor.usage.footer.7 = parolası (veya --oauth2) ister. Sağlayıcı ayarları ve güvenlik notları için
phishnet\ monitor.usage.footer.8 = README'deki "Real-Time Email Monitoring" bölümüne bakın.
phishnet\ monitor.host = Posta sunucusu, ör. imap.gmail.com
phishnet\ monitor.port = Sunucu portu (varsayılan: --ssl ile IMAP için 993, onsuz 143; POP3 için 995/110)
phishnet\ monitor.username = Oturum açma adı, genellikle e-posta adresiniz (veya PHISHNET_MAIL_USERNAME tanımlayın)
phishnet\ monitor.password = Parolayı ekrana yansıtmadan sorar. Bu seçenek olmadan parola PHISHNET_MAIL_PASSWORD değişkeninden okunur ya da terminalde çalışılıyorsa sorulur. Komut satırında düz bir değer olarak asla kabul edilmez.
phishnet\ monitor.protocol = ${COMPLETION-CANDIDATES} (varsayılan: ${DEFAULT-VALUE}). POP3 yalnızca yoklama yapar ve salt okunurdur.
phishnet\ monitor.ssl = Baştan itibaren TLS kullanır (IMAPS / POP3S) - olağan seçim
phishnet\ monitor.starttls = Düz metinle bağlanır, ardından STARTTLS ile şifreli bağlantıya geçmeyi zorunlu kılar
phishnet\ monitor.allow-plaintext = Hiç şifreleme yok: parola okunabilir biçimde gönderilir. Yalnızca yerel bir test sunucusu için.
phishnet\ monitor.folder = İzlenecek IMAP klasörü (varsayılan: ${DEFAULT-VALUE})
phishnet\ monitor.oauth2 = OAuth2 (SASL XOAUTH2) ile oturum açar: parola değeri, sağlayıcınızdan aldığınız bir erişim belirtecidir
phishnet\ monitor.poll-interval = Sunucu IMAP IDLE desteklemediğinde, POP3'te ise her zaman, yeni postanın ne sıklıkla kontrol edileceği (varsayılan: ${DEFAULT-VALUE}, en az 5)
phishnet\ monitor.act-on = Şüpheli sayılacak en düşük risk düzeyi: MEDIUM veya HIGH (varsayılan: ${DEFAULT-VALUE})
phishnet\ monitor.flag-suspicious = İsteğe bağlı: şüpheli iletileri \\Flagged (ve izin verilen yerlerde $Phishing anahtar sözcüğü) ile işaretler. Posta kutusunu değiştirir; yalnızca IMAP.
phishnet\ monitor.move-to-folder = İsteğe bağlı: şüpheli iletileri bu klasöre taşır, gerekirse klasörü oluşturur. Posta kutusunu değiştirir; yalnızca IMAP.
phishnet\ monitor.record-all = Yalnızca şüphelileri değil, taranan her iletiyi tarama geçmişine kaydeder
phishnet\ monitor.history-file = Tarama geçmişi CSV dosyası (varsayılan: ./phishnet-history.csv)
phishnet\ monitor.no-history = Sonuçları tarama geçmişi CSV dosyasına eklemez
phishnet\ monitor.history-db = Tarama geçmişi veritabanı (varsayılan: ~/.phishnet/phishnet-history.db)
phishnet\ monitor.no-history-db = Sonuçları tarama geçmişi veritabanına kaydetmez
phishnet\ monitor.config = Paketle gelen varsayılan yerine özel bir YAML yapılandırması kullanır
phishnet\ monitor.verbose = Her iletinin sinyallerini ve posta kutusu etiketini, ayrıca bağlantı denemelerini de gösterir
phishnet\ monitor.quiet = Taranan her ileti için yalnızca bir satır yazdırır (LEVEL SCORE LABEL)
phishnet\ monitor.no-color = Terminal destekliyor olsa bile ANSI renklerini kapatır
phishnet\ monitor.group.ssl = %nŞifreleme (biri zorunlu):%n

