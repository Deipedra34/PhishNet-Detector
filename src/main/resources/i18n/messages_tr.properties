# PhishNet Detector - user-facing text, Turkish (Türkçe).
#
# Same keys as messages.properties (English); a key missing here falls back to the
# English text. Placeholders ({0}, {1}, ...) and picocli's %n, %% and ${...} work the
# same way as there. Technical terms (URL, API, JSON, TLS, WHOIS, ...), option names,
# commands, and option values such as LOW/MEDIUM/HIGH are left untranslated.
# Numbered help lines (usage.footer.N) must keep the English file's line count:
# picocli also sees the English lines, so a shorter list would end in English.

# ======================================================================
# Command-line help (picocli)
# ======================================================================

# --help and --version, on every command
mixinStandardHelpOptions.help = Bu yardım iletisini gösterir ve çıkar.
mixinStandardHelpOptions.version = Sürüm bilgisini yazdırır ve çıkar.
lang = Çıktı dili: en veya tr (varsayılan: destekleniyorsa sistem dili, değilse İngilizce)

# --- phishnet ---
phishnet.usage.description = URL'leri, TLS sertifikalarını ve .eml e-posta dosyalarını oltalama (phishing) belirtilerine karşı inceler ve bulduklarını Düşük/Orta/Yüksek etiketli, 0-100 arası tek bir risk puanında ve sade bir öneride birleştirir.
phishnet.usage.synopsisHeading = %nKullanım:%n
phishnet.usage.optionListHeading = %nSeçenekler:%n
phishnet.usage.footerHeading = %nÖrnekler:%n
phishnet.usage.footer.0 = \  phishnet --url https://example.com
phishnet.usage.footer.1 = \  phishnet --email suspicious.eml --verbose
phishnet.usage.footer.2 = \  phishnet --batch urls.txt --json
phishnet.usage.footer.3 = \  phishnet serve --port 8080   (REST API modu; bkz. phishnet serve --help)
phishnet.usage.footer.4 = \  phishnet history list        (geçmiş taramalar; bkz. phishnet history --help)
phishnet.usage.footer.5 = \  phishnet model info          (ML modeli ayrıntıları; bkz. phishnet model --help)
phishnet.usage.footer.6 = \  phishnet monitor --help      (gelen postayı oltalamaya karşı anında izler)
phishnet.usage.footer.7 = \  phishnet queue --help        (Redis çalışanlarıyla dağıtık tarama)
phishnet.usage.footer.8 = \  phishnet feeds status        (tehdit istihbaratı beslemeleri; bkz. phishnet feeds --help)
phishnet.usage.footer.9 =
phishnet.usage.footer.10 = Tüm seçeneklerin açıklaması ve örnek çıktılar için projenin README dosyasına bakın.
phishnet.url = Tek bir URL'yi analiz eder
phishnet.email = Tek bir .eml e-posta dosyasını analiz eder
phishnet.batch = Her satırda bir URL bulunan bir dosyayı analiz eder ('#' ile başlayan yorum satırlarına izin verilir)
phishnet.config = Paketle gelen varsayılan yerine özel bir YAML yapılandırması kullanır
phishnet.json = İnsanların okuyacağı rapor yerine makinece okunabilir JSON çıktısı verir
phishnet.no-color = Terminal destekliyor olsa bile ANSI renklerini kapatır
phishnet.verbose = Yalnızca özeti değil, her analiz aracının iç gerekçesini de gösterir
phishnet.quiet = Yalnızca makinece ayrıştırılabilir tek bir satır yazdırır (LEVEL SCORE TARGET); çıkış kodu riski yansıtır
phishnet.history-file = Tarama sonuçlarını bu CSV dosyasına ekler (varsayılan: ./phishnet-history.csv)
phishnet.no-history = Bu çalıştırmanın sonuçlarını tarama geçmişi CSV dosyasına eklemez
phishnet.history-db = Tarama sonuçlarını bu SQLite veritabanına kaydeder (varsayılan: ~/.phishnet/phishnet-history.db; sorgulamak için: phishnet history)
phishnet.no-history-db = Bu çalıştırmanın sonuçlarını tarama geçmişi veritabanına kaydetmez
phishnet.html-report = Bu çalıştırmanın sonuçlarını içeren, kendi başına açılabilen biçimli bir HTML raporunu <path> konumuna yazar (--batch için tüm çalıştırmayı kapsayacak şekilde sonda bir kez yazılır)
phishnet.no-whois = Canlı WHOIS alan adı yaşı sorgusunu atlar (çevrimdışı/hızlı taramalar veya CI için); bu durumda alan adı yaşı puana hiç katılmaz
phishnet.no-threat-feeds = OpenPhish/PhishTank tehdit istihbaratı beslemelerini kontrol etmez (besleme indirilmez, önbellekteki beslemeler kullanılmaz); bu durumda besleme eşleşmeleri puana katılmaz
phishnet.threads = --batch URL'lerini bu kadar iş parçacığında paralel tarar (varsayılan: CPU çekirdeği başına bir; 1 hepsini sırayla tarar). Çıktı sırası her iki durumda da aynıdır.
phishnet.no-ml = Deneysel ML oltalama olasılığı sinyalini tamamen atlar; kural tabanlı risk puanı bundan etkilenmez
phishnet.model = ML model dosyası; yoksa ilk kullanımda paketle gelen veri kümesiyle eğitilir (varsayılan: ~/.phishnet/phishnet-model.json; bkz. phishnet model --help)
phishnet.group.url = %nGirdi seçenekleri:%n
phishnet.group.json = %nÇıktı seçenekleri:%n
phishnet.group.history-file = %nGeçmiş seçenekleri:%n
phishnet.group.html-report = %nRapor seçenekleri:%n
phishnet.group.no-whois = %nAğ seçenekleri:%n
phishnet.group.threads = %nToplu tarama seçenekleri:%n
phishnet.group.no-ml = %nMakine öğrenmesi seçenekleri (deneysel):%n

# --- phishnet serve ---
phishnet\ serve.usage.description = Tarayıcıyı JSON REST API olarak sunan bir HTTP sunucusu başlatır (POST /api/scan/url, POST /api/scan/email, GET /api/health); ayrıca salt okunur geçmiş ve besleme durumu uç noktalarını ve derlenmişse web panelini aynı portta sunar.
phishnet\ serve.usage.synopsisHeading = %nKullanım:%n
phishnet\ serve.usage.optionListHeading = %nSeçenekler:%n
phishnet\ serve.usage.footerHeading = %nÖrnekler:%n
phishnet\ serve.usage.footer.0 = \  phishnet serve
phishnet\ serve.usage.footer.1 = \  phishnet serve --port 9090 --no-whois
phishnet\ serve.usage.footer.2 = \  phishnet serve --dashboard dashboard/dist
phishnet\ serve.usage.footer.3 = \  phishnet serve --regenerate-key      (API anahtarını değiştirir)
phishnet\ serve.usage.footer.4 = \  phishnet serve --no-auth             (yalnızca yerel geliştirme için: API anahtarı yok)
phishnet\ serve.port = Dinlenecek TCP portu (varsayılan: ${DEFAULT-VALUE}; 0 boş bir port seçer)
phishnet\ serve.config = Paketle gelen varsayılan yerine özel bir YAML yapılandırması kullanır
phishnet\ serve.no-whois = URL taramalarında canlı WHOIS alan adı yaşı sorgusunu atlar
phishnet\ serve.history-db = API taramalarını bu SQLite veritabanına kaydeder (varsayılan: ~/.phishnet/phishnet-history.db; sorgulamak için: phishnet history)
phishnet\ serve.no-history-db = API taramalarını tarama geçmişi veritabanına kaydetmez
phishnet\ serve.dashboard = Derlenmiş web panelini bu dizinden sunar (varsayılan: $PHISHNET_DASHBOARD_DIR, yoksa ./dashboard/dist, yoksa jar dosyasının yanındaki dashboard/ klasörü - içinde index.html bulunan ilki)
phishnet\ serve.no-dashboard = Web paneli olmadan yalnızca REST API'yi sunar
phishnet\ serve.api-key-file = API anahtarının saklandığı yer (varsayılan: ~/.phishnet/api-key; ilk çalıştırmada rastgele yeni bir anahtarla oluşturulur). $PHISHNET_API_KEY tanımlıysa onun yerine o kullanılır.
phishnet\ serve.regenerate-key = Başlamadan önce API anahtarını rastgele yeni bir anahtarla değiştirir (bir kez yazdırılır). Eski anahtar artık çalışmaz; yenisini her istemciye verin.
phishnet\ serve.rate-limit = Her istemci IP'sinin, 429 Too Many Requests almadan önce dakikada yapabileceği tarama isteği sayısı (varsayılan: yapılandırmadaki api.rateLimitPerMinute, 60; 0 sınırı kapatır)
phishnet\ serve.no-auth = API anahtarı istemez: bu porta erişebilen herkes tarama yapabilir ve tarama geçmişini okuyabilir. Yalnızca yerel geliştirme içindir.

