# slf4j-simple settings for "phishnet serve" (the regular CLI never logs via SLF4J).
# Javalin's own startup lines stay at INFO; Jetty's startup chatter is cut to warnings.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.log.org.eclipse.jetty=warn
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss
org.slf4j.simpleLogger.showThreadName=false
